name: CD - Development Deploy

on:
  push:
    branches: [development]

concurrency:
  group: cd-development
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: api
            image: nexus-api
            dockerfile: apps/api/Dockerfile
          - app: web
            image: nexus-web
            dockerfile: apps/web/Dockerfile
          - app: email-worker
            image: nexus-email-worker
            dockerfile: apps/email-worker/Dockerfile
          - app: event-worker
            image: nexus-event-worker
            dockerfile: apps/event-worker/Dockerfile
          - app: pdf-worker
            image: nexus-pdf-worker
            dockerfile: apps/pdf-worker/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=dev-,format=short
            type=raw,value=latest

      - name: Build and Push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  update-image-tags:
    name: Update Image Tags in Kustomize
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update image tags in dev overlay
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          cd k8s/overlays/dev

          # آپدیت کردن tag ایمیج‌ها به SHA جدید
          sed -i "s|newTag: .*|newTag: dev-${SHORT_SHA}|g" kustomization.yaml

          # آپدیت کردن newName به آدرس ghcr.io
          sed -i "s|newName: nexus-api$|newName: ${{ env.IMAGE_PREFIX }}/nexus-api|g" kustomization.yaml
          sed -i "s|newName: nexus-web$|newName: ${{ env.IMAGE_PREFIX }}/nexus-web|g" kustomization.yaml
          sed -i "s|newName: nexus-email-worker$|newName: ${{ env.IMAGE_PREFIX }}/nexus-email-worker|g" kustomization.yaml
          sed -i "s|newName: nexus-event-worker$|newName: ${{ env.IMAGE_PREFIX }}/nexus-event-worker|g" kustomization.yaml
          sed -i "s|newName: nexus-pdf-worker$|newName: ${{ env.IMAGE_PREFIX }}/nexus-pdf-worker|g" kustomization.yaml

      - name: Commit and push updated tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          git config user.name "nexus-cd-argo-bot[bot]"
          git config user.email "nexus-cd-argo-bot[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update dev image tags to dev-${SHORT_SHA} [skip ci]"
          git push