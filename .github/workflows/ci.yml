name: Enterprise CI Pipeline
on:
  push:
    branches: [ main, staging, development ]
  pull_request:
    branches: [ main, staging, development ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps
      - name: Monorepo Turborepo/Nx Build Cache Setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Check Code Formatting
        run: npm run format:check --if-present
      - name: Run Linter Across Workspace
        run: npm run lint --if-present
      - name: Security Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high
  type-check-and-test:
    name: Type Check & Automated Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: TypeScript Type Check Across Packages
        run: npm run typecheck --if-present
      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage --if-present
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: type-check-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Build All Monorepo Apps & Packages
        run: npm run build --if-present