name: Enterprise CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging, development]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Checks
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/pdf-worker/go.sum

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps

      - name: Monorepo Turborepo/Nx Build Cache Setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-


      - name: Check Go Code Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l apps/pdf-worker)" ]; then
            echo "The following Go files are not formatted correctly:"
            gofmt -l apps/pdf-worker
            exit 1
          fi

      - name: Run Linter Across Workspace (ESLint)
        run: npm run lint --if-present

      - name: TypeScript Type Check Across Packages
        run: npm run typecheck --if-present

  automated-tests:
    name: Automated Tests & Coverage
    needs: code-quality
    if: |
      github.event_name == 'pull_request' ||
      contains(fromJSON('["main", "staging", "development"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/pdf-worker/go.sum

      - name: Install Dependencies
        run: npm ci

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run TypeScript Unit & Integration Tests
        run: npm run test:coverage --if-present

      - name: Run Go Unit & Integration Tests
        run: npm run test:go --if-present

  build-verification:
    name: Build Verification
    needs: automated-tests
    if: |
      github.event_name == 'pull_request' ||
      contains(fromJSON('["main", "staging", "development"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build All Monorepo Apps & Packages
        run: npm run build --if-present