# --- Prometheus ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: nexus-prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
