apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-worker
  labels: &labels
    app.kubernetes.io/name: event-worker
    app.kubernetes.io/part-of: nexus
    nexus.io/tier: app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: event-worker
  template:
    metadata:
      labels:
        <<: *labels
        nexus.io/egress: none
    spec:
      serviceAccountName: event-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60 # فرصت برای commit offsetها و اتمام کار جاری
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: event-worker } }
      containers:
        - name: event-worker
          image: nexus-event-worker
          envFrom:
            - configMapRef: { name: global-env-config }
          env:
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: nexus-pg-app-credentials, key: username } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: nexus-pg-app-credentials, key: password } }
            - name: DATABASE_URL
              value: "postgres://$(PG_USER):$(PG_PASSWORD)@nexus-pg-rw:5432/nexus_db"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "500m", memory: 256Mi }
          # worker پورت ندارد. برای liveness واقعی، endpoint سلامت/متریک به worker اضافه کن.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: event-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-worker
