apiVersion: v1
kind: ConfigMap
metadata:
  name: global-env-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  PRESENTATION_DRIVER: "fastify"

  DATABASE_URL: "postgres://nexus_user:nexus_password123@postgres-service:5432/nexus_db"
  REDIS_URL: ""

  OTEL_SERVICE_NAME: "nexus-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-service:4318"
  LOKI_URL: "http://loki-service:3100"

  JWT_SECRET: "change-me-in-production"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"

  SWAGGER_UI_ENABLED: "true"
  REBUILD_DOCS: "true"
  API_PUBLIC_URL: "http://localhost:80"
  TRACING_LEVEL: "hard"

  KAFKA_BROKER: "kafka-service:29092"
  KAFKA_BROKERS: "kafka-service:29092"
  KAFKAJS_NO_PARTITIONER_WARNING: "1"
  KAFKA_CONSUME_TOPIC: "nexus.user"
  KAFKA_REPLY_TOPIC: "email.notifications.reply"
  KAFKA_DLQ_TOPIC: "email.notifications.dlq"

  CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://app.mydomain.com,https://admin.mydomain.com"

  S3_ENDPOINT: "minio-service:9000"
  S3_ACCESS_KEY: "nexus_admin"
  S3_SECRET_KEY: "nexus_password123"
  S3_BUCKET_NAME: "nexus-pdfs"
  S3_USE_SSL: "false"
  S3_REGION: "us-east-1"
  MINIO_CONSOLE_PORT: "9001"
