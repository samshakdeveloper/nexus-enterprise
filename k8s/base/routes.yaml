# Gateway در overlayها تعریف می‌شود (hostname و TLS وابسته به محیط است)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - { name: nexus-gateway, sectionName: https }
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      # بدون URLRewrite: مسیرهای API از خود سرویس با پیشوند /api/v1 تعریف شده‌اند
      backendRefs:
        - { name: api-service, port: 3000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - { name: nexus-gateway, sectionName: https }
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: web-service, port: 3000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
spec:
  parentRefs:
    - { name: nexus-gateway, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
