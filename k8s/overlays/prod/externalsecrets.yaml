# هیچ secret ای در Git نیست؛ همه از Vault (از طریق ClusterSecretStore با نام vault) می‌آیند.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: nexus-pg-app-credentials }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target:
    name: nexus-pg-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - { secretKey: username, remoteRef: { key: nexus/prod/postgres, property: username } }
    - { secretKey: password, remoteRef: { key: nexus/prod/postgres, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: nexus-app }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: nexus-app, creationPolicy: Owner }
  data:
    - { secretKey: JWT_SECRET, remoteRef: { key: nexus/prod/app, property: jwt_secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: nexus-s3 }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: nexus-s3, creationPolicy: Owner }
  data:
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: nexus/prod/s3, property: access_key } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: nexus/prod/s3, property: secret_key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: nexus-pg-backup-s3 }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: nexus-pg-backup-s3, creationPolicy: Owner }
  data:
    - { secretKey: ACCESS_KEY_ID, remoteRef: { key: nexus/prod/pg-backup-s3, property: access_key } }
    - { secretKey: ACCESS_SECRET_KEY, remoteRef: { key: nexus/prod/pg-backup-s3, property: secret_key } }
---
# کلیدهای SMTP_* / ... همان‌طور که در Vault هستند به env تبدیل می‌شوند
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: nexus-smtp }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: nexus-smtp, creationPolicy: Owner }
  dataFrom:
    - extract: { key: nexus/prod/smtp }
