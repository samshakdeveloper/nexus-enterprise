# فقط dev: Redis (idempotency ایمیل‌ورکر) و Mailpit (SMTP آزمایشی؛ UI روی پورت 8025).
# در prod: Redis مدیریت‌شده / کلاستر Redis و SMTP واقعی از Secret با نام nexus-smtp.
apiVersion: v1
kind: Service
metadata: {name: redis-service}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: nexus}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: nexus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: mailpit}
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: nexus}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: nexus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21   # dev-only؛ اگر tag را پیدا نکرد، آخرین v1.x را بگذار
          env:
            - {name: MP_DATABASE, value: /tmp/mailpit.db}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# egress ایمیل‌ورکر به Redis و Mailpit (default-deny اجازه نمی‌داد)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-email-worker-egress-deps-dev}
spec:
  podSelector: {matchLabels: {nexus.io/egress: smtp}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: mailpit}}
      ports: [{protocol: TCP, port: 1025}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-redis-ingress-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {nexus.io/egress: smtp}}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-mailpit-ingress-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mailpit}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {nexus.io/egress: smtp}}
      ports: [{protocol: TCP, port: 1025}]
