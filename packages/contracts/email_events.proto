syntax = "proto3";

package nexus.email.v1;

// پیام درخواست ارسال ایمیل (وقتی API یا Event Worker منتشر می‌کند)
message SendEmailCommand {
  string message_id = 1;
  string recipient_email = 2;
  string subject = 3;
  string body_html = 4;
  map<string, string> metadata = 5;
}

// پیام نتیجه ارسال ایمیل (وقتی email-worker کارش تمام می‌شود)
message EmailSentEvent {
  string message_id = 1;
  string recipient_email = 2;
  bool is_success = 3;
  string error_message = 4;
  int64 timestamp = 5;
}