apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-enterprise
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/samshakdeveloper/nexus-enterprise
    targetRevision: development
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: nexus-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # CloudNativePG و Kafka مدام status را آپدیت می‌کنند — false positive نمی‌دهیم
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers: [/status]
    - group: kafka.strimzi.io
      kind: Kafka
      jsonPointers: [/status]
    - group: kafka.strimzi.io
      kind: KafkaNodePool
      jsonPointers: [/status]
    # kubectl rollout restart یه annotation اضافه می‌کند — ignore کن
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt