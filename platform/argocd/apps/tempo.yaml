# معادل k8s این تنظیمات فعلی monitoring/tempo/tempo.yaml: همان receiverهای OTLP (http/grpc)
# و block_retention: 168h، ولی روی PVC به‌جای volume موقت لوکال.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.14.0" # TODO: قبل از اعمال، آخرین نسخه‌ی پایدار را چک کن
    helm:
      valuesObject:
        tempo:
          retention: 168h
          receivers:
            otlp:
              protocols:
                http: { endpoint: "0.0.0.0:4318" }
                grpc: { endpoint: "0.0.0.0:4317" }
        persistence:
          enabled: true
          size: 10Gi # TODO(prod): با حجم واقعی trace ها تنظیم کن
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
