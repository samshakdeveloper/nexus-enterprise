# معادل k8s این تنظیمات فعلی monitoring/loki/loki-config.yml (که فقط برای docker-compose محلی است):
# همان auth غیرفعال، storage روی filesystem، schema tsdb v13، و retention 168h.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.16.0"   # TODO: قبل از اعمال، آخرین نسخه‌ی پایدار را چک کن
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: {replication_factor: 1}
          storage: {type: filesystem}
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: index_, period: 24h}
          limits_config:
            retention_period: 168h
            allow_structured_metadata: true
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi   # TODO(prod): با حجم واقعی لاگ‌ها تنظیم کن
        gateway: {enabled: true}
        # dev سبک؛ برای prod به chunk cache/compactor جدا و replication_factor بالاتر فکر کن
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
