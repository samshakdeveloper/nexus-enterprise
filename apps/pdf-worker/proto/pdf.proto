syntax = "proto3";

package pdf.v1;

option go_package = "nexus-enterprise/pdf-worker/gen/pdf_v1;pdf_v1";

message GeneratePdfCommand {
  string id = 1;
  string html_content = 2;
  string payload = 3;
}

message PdfGeneratedEvent {
  string id = 1;
  string file_url = 2;
  bool success = 3;
  string error = 4;
}